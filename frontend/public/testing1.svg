<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" font-family="'Segoe UI', 'SF Pro Display', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="apiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f3460"/>
      <stop offset="100%" style="stop-color:#16537e"/>
    </linearGradient>
    <linearGradient id="reduxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a1a6b"/>
      <stop offset="100%" style="stop-color:#6b2a8f"/>
    </linearGradient>
    <linearGradient id="validGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1b5e20"/>
      <stop offset="100%" style="stop-color:#2e7d32"/>
    </linearGradient>
    <linearGradient id="compGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#b71c1c"/>
      <stop offset="100%" style="stop-color:#c62828"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrowheadLight" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4fc3f7"/>
    </marker>
    <marker id="arrowheadGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#81c784"/>
    </marker>
    <marker id="arrowheadPurple" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ce93d8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="820" fill="url(#bgGrad)"/>
  
  <!-- Subtle grid pattern -->
  <g opacity="0.03">
    <line x1="0" y1="100" x2="1200" y2="100" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="400" x2="1200" y2="400" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="500" x2="1200" y2="500" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="600" x2="1200" y2="600" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="700" x2="1200" y2="700" stroke="#fff" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="820" stroke="#fff" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="820" stroke="#fff" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="820" stroke="#fff" stroke-width="0.5"/>
    <line x1="800" y1="0" x2="800" y2="820" stroke="#fff" stroke-width="0.5"/>
    <line x1="1000" y1="0" x2="1000" y2="820" stroke="#fff" stroke-width="0.5"/>
  </g>

  <!-- ============================================ -->
  <!-- LAYER 4: COMPONENT TESTING (TOP)             -->
  <!-- ============================================ -->
  
  <!-- Layer 4 container -->
  <rect x="50" y="40" width="1100" height="170" rx="10" fill="rgba(183,28,28,0.08)" stroke="#c62828" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="65" y="65" fill="#ef9a9a" font-size="12" font-weight="600" letter-spacing="1">LAYER 4 — REACT COMPONENT TESTING</text>
  
  <!-- Login.test.tsx box -->
  <rect x="80" y="80" width="290" height="115" rx="8" fill="url(#compGrad)" filter="url(#shadow)" opacity="0.9"/>
  <text x="225" y="102" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">Login.test.tsx</text>
  <text x="225" y="122" text-anchor="middle" fill="#ffcdd2" font-size="11" font-family="monospace">React Testing Library</text>
  <line x1="100" y1="130" x2="350" y2="130" stroke="#fff" stroke-width="0.5" opacity="0.3"/>
  <text x="120" y="148" fill="#ffcdd2" font-size="11">1. Render &lt;Login /&gt;</text>
  <text x="120" y="165" fill="#ffcdd2" font-size="11">2. Type email + password</text>
  <text x="120" y="182" fill="#ffcdd2" font-size="11">3. Click submit → mock store</text>
  
  <!-- Component interaction box -->
  <rect x="400" y="80" width="300" height="115" rx="8" fill="rgba(198,40,40,0.25)" stroke="#ef5350" stroke-width="1" filter="url(#shadow)"/>
  <text x="550" y="102" text-anchor="middle" fill="#ffcdd2" font-size="13" font-weight="600">User Flow</text>
  <line x1="420" y1="110" x2="680" y2="110" stroke="#ffcdd2" stroke-width="0.5" opacity="0.3"/>
  <text x="425" y="128" fill="#ffcdd2" font-size="11">type → submit → API call</text>
  <text x="425" y="145" fill="#ffcdd2" font-size="11">→ Redux state update</text>
  <text x="425" y="162" fill="#ffcdd2" font-size="11">→ UI re-render</text>
  <text x="425" y="179" fill="#ffcdd2" font-size="11">→ assert DOM elements</text>

  <!-- What gets tested box -->
  <rect x="730" y="80" width="400" height="115" rx="8" fill="rgba(198,40,40,0.15)" stroke="#ef5350" stroke-width="1" filter="url(#shadow)"/>
  <text x="930" y="102" text-anchor="middle" fill="#ffcdd2" font-size="13" font-weight="600">Coverage</text>
  <line x1="750" y1="110" x2="1110" y2="110" stroke="#ffcdd2" stroke-width="0.5" opacity="0.3"/>
  <text x="750" y="128" fill="#ffcdd2" font-size="11">• Form rendering + validation</text>
  <text x="750" y="145" fill="#ffcdd2" font-size="11">• User interaction (RTL)</text>
  <text x="750" y="162" fill="#ffcdd2" font-size="11">• Redux integration via mock store</text>
  <text x="750" y="179" fill="#ffcdd2" font-size="11">• Async API call + UI update</text>

  <!-- ============================================ -->
  <!-- LAYER 3: REDUX AUTHENTICATION                 -->
  <!-- ============================================ -->

  <!-- Layer 3 container -->
  <rect x="50" y="230" width="1100" height="170" rx="10" fill="rgba(106,27,154,0.08)" stroke="#8e24aa" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="65" y="255" fill="#ce93d8" font-size="12" font-weight="600" letter-spacing="1">LAYER 3 — REDUX AUTHENTICATION LAYER</text>

  <!-- authSlice.ts -->
  <rect x="80" y="270" width="240" height="115" rx="8" fill="url(#reduxGrad)" filter="url(#shadow)" opacity="0.9"/>
  <text x="200" y="292" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">authSlice.ts</text>
  <text x="200" y="312" text-anchor="middle" fill="#e1bee7" font-size="11" font-family="monospace">Redux Toolkit</text>
  <line x1="95" y1="320" x2="305" y2="320" stroke="#fff" stroke-width="0.5" opacity="0.3"/>
  <text x="105" y="338" fill="#e1bee7" font-size="11">• login(credentials)</text>
  <text x="105" y="355" fill="#e1bee7" font-size="11">• initializeAuth()</text>
  <text x="105" y="372" fill="#e1bee7" font-size="11">• finishAuthInitialization()</text>
  
  <!-- authSlice.test.ts -->
  <rect x="350" y="270" width="260" height="115" rx="8" fill="rgba(142,36,170,0.25)" stroke="#ab47bc" stroke-width="1" filter="url(#shadow)"/>
  <text x="480" y="292" text-anchor="middle" fill="#e1bee7" font-size="13" font-weight="700">authSlice.test.ts</text>
  <text x="480" y="312" text-anchor="middle" fill="#e1bee7" font-size="11" font-family="monospace">Jest + Redux store</text>
  <line x1="370" y1="320" x2="590" y2="320" stroke="#e1bee7" stroke-width="0.5" opacity="0.3"/>
  <text x="375" y="338" fill="#e1bee7" font-size="11">• mock store dispatch</text>
  <text x="375" y="355" fill="#e1bee7" font-size="11">• state transitions</text>
  <text x="375" y="372" fill="#e1bee7" font-size="11">• localStorage persistence</text>

  <!-- Flow arrows -->
  <path d="M 320 330 C 330 330, 335 330, 350 330" stroke="#ce93d8" stroke-width="1.5" fill="none" marker-end="url(#arrowheadPurple)"/>

  <!-- State box -->
  <rect x="640" y="270" width="490" height="115" rx="8" fill="rgba(142,36,170,0.12)" stroke="#ce93d8" stroke-width="1" filter="url(#shadow)"/>
  <text x="885" y="292" text-anchor="middle" fill="#e1bee7" font-size="13" font-weight="600">Redux State Shape</text>
  <line x1="660" y1="300" x2="1110" y2="300" stroke="#e1bee7" stroke-width="0.5" opacity="0.3"/>
  <text x="665" y="320" fill="#e1bee7" font-size="11" font-family="monospace">auth: {</text>
  <text x="685" y="337" fill="#e1bee7" font-size="11" font-family="monospace">status: 'idle' | 'loading' | 'authenticated' | 'error'</text>
  <text x="685" y="354" fill="#e1bee7" font-size="11" font-family="monospace">user: User | null</text>
  <text x="685" y="371" fill="#e1bee7" font-size="11" font-family="monospace">isInitialized: boolean</text>
  <text x="665" y="388" fill="#e1bee7" font-size="11" font-family="monospace">}</text>

  <!-- ============================================ -->
  <!-- LAYER 2: API LAYER                            -->
  <!-- ============================================ -->

  <!-- Layer 2 container -->
  <rect x="50" y="420" width="1100" height="180" rx="10" fill="rgba(13,71,161,0.08)" stroke="#1976d2" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="65" y="445" fill="#64b5f6" font-size="12" font-weight="600" letter-spacing="1">LAYER 2 — API LAYER</text>

  <!-- userApi.ts -->
  <rect x="80" y="460" width="280" height="125" rx="8" fill="url(#apiGrad)" filter="url(#shadow)" opacity="0.9"/>
  <text x="220" y="482" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">userApi.ts</text>
  <text x="220" y="502" text-anchor="middle" fill="#90caf9" font-size="11" font-family="monospace">fetch wrapper</text>
  <line x1="95" y1="510" x2="345" y2="510" stroke="#fff" stroke-width="0.5" opacity="0.3"/>
  <text x="100" y="528" fill="#90caf9" font-size="10.5">getUsers()</text>
  <text x="100" y="544" fill="#90caf9" font-size="10.5">getUserById(id)</text>
  <text x="100" y="560" fill="#90caf9" font-size="10.5">createUser(data)</text>
  <text x="100" y="576" fill="#90caf9" font-size="10.5">updateUser(id, data)</text>
  <text x="100" y="592" fill="#90caf9" font-size="10.5">deleteUser(id) · loginUser(creds)</text>

  <!-- userApi.test.ts -->
  <rect x="395" y="460" width="290" height="125" rx="8" fill="rgba(25,118,210,0.2)" stroke="#42a5f5" stroke-width="1" filter="url(#shadow)"/>
  <text x="540" y="482" text-anchor="middle" fill="#90caf9" font-size="13" font-weight="700">userApi.test.ts</text>
  <text x="540" y="502" text-anchor="middle" fill="#90caf9" font-size="11" font-family="monospace">Jest + mock fetch</text>
  <line x1="415" y1="510" x2="665" y2="510" stroke="#90caf9" stroke-width="0.5" opacity="0.3"/>
  <text x="420" y="528" fill="#90caf9" font-size="10.5">✓ success responses (200)</text>
  <text x="420" y="544" fill="#90caf9" font-size="10.5">✓ backend errors (4xx/5xx)</text>
  <text x="420" y="560" fill="#90caf9" font-size="10.5">✓ network failures</text>
  <text x="420" y="576" fill="#90caf9" font-size="10.5">✓ invalid JSON handling</text>

  <!-- Flow -->
  <path d="M 360 520 C 375 520, 380 520, 395 520" stroke="#64b5f6" stroke-width="1.5" fill="none" marker-end="url(#arrowheadLight)"/>

  <!-- Notes box -->
  <rect x="715" y="460" width="415" height="125" rx="8" fill="rgba(25,118,210,0.1)" stroke="#64b5f6" stroke-width="1" filter="url(#shadow)"/>
  <text x="922" y="482" text-anchor="middle" fill="#90caf9" font-size="13" font-weight="600">Mock Strategy</text>
  <line x1="735" y1="490" x2="1105" y2="490" stroke="#90caf9" stroke-width="0.5" opacity="0.3"/>
  <text x="735" y="508" fill="#90caf9" font-size="11">• global.fetch = jest.fn()</text>
  <text x="735" y="526" fill="#90caf9" font-size="11">• mockResolvedValueOnce()</text>
  <text x="735" y="544" fill="#90caf9" font-size="11">• mockRejectedValueOnce()</text>
  <text x="735" y="562" fill="#90caf9" font-size="11">• assert calledWith URL + options</text>
  <text x="735" y="580" fill="#90caf9" font-size="11">• no real network requests</text>

  <!-- ============================================ -->
  <!-- LAYER 1: VALIDATION / UTILITIES (BOTTOM)     -->
  <!-- ============================================ -->

  <!-- Layer 1 container -->
  <rect x="50" y="620" width="1100" height="170" rx="10" fill="rgba(27,94,32,0.08)" stroke="#43a047" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="65" y="645" fill="#a5d6a7" font-size="12" font-weight="600" letter-spacing="1">LAYER 1 — VALIDATION &amp; UTILITIES (PURE UNIT TESTS)</text>

  <!-- Three test boxes -->
  <rect x="80" y="660" width="320" height="115" rx="8" fill="url(#validGrad)" filter="url(#shadow)" opacity="0.9"/>
  <text x="240" y="682" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">authValidation.ts</text>
  <text x="240" y="702" text-anchor="middle" fill="#a5d6a7" font-size="11" font-family="monospace">→ authValidation.test.ts</text>
  <line x1="95" y1="710" x2="385" y2="710" stroke="#fff" stroke-width="0.5" opacity="0.3"/>
  <text x="105" y="730" fill="#c8e6c9" font-size="11">• validateEmail format</text>
  <text x="105" y="747" fill="#c8e6c9" font-size="11">• validatePassword rules</text>
  <text x="105" y="764" fill="#c8e6c9" font-size="11">• edge cases + empty inputs</text>

  <rect x="430" y="660" width="320" height="115" rx="8" fill="rgba(67,160,71,0.2)" stroke="#66bb6a" stroke-width="1" filter="url(#shadow)"/>
  <text x="590" y="682" text-anchor="middle" fill="#c8e6c9" font-size="13" font-weight="700">loginValidation.ts</text>
  <text x="590" y="702" text-anchor="middle" fill="#a5d6a7" font-size="11" font-family="monospace">→ loginValidation.test.ts</text>
  <line x1="445" y1="710" x2="735" y2="710" stroke="#a5d6a7" stroke-width="0.5" opacity="0.3"/>
  <text x="455" y="730" fill="#c8e6c9" font-size="11">• input sanitization</text>
  <text x="455" y="747" fill="#c8e6c9" font-size="11">• required-field checks</text>
  <text x="455" y="764" fill="#c8e6c9" font-size="11">• error message generation</text>

  <rect x="780" y="660" width="320" height="115" rx="8" fill="rgba(67,160,71,0.15)" stroke="#81c784" stroke-width="1" filter="url(#shadow)"/>
  <text x="940" y="682" text-anchor="middle" fill="#c8e6c9" font-size="13" font-weight="700">passwordStrength.ts</text>
  <text x="940" y="702" text-anchor="middle" fill="#a5d6a7" font-size="11" font-family="monospace">→ passwordStrength.test.ts</text>
  <line x1="795" y1="710" x2="1085" y2="710" stroke="#a5d6a7" stroke-width="0.5" opacity="0.3"/>
  <text x="805" y="730" fill="#c8e6c9" font-size="11">• score 0–4 calculation</text>
  <text x="805" y="747" fill="#c8e6c9" font-size="11">• length + character classes</text>
  <text x="805" y="764" fill="#c8e6c9" font-size="11">• common-pattern detection</text>

  <!-- ============================================ -->
  <!-- DEPENDENCY ARROWS BETWEEN LAYERS              -->
  <!-- ============================================ -->

  <!-- Arrow Layer 1 → Layer 2 (up) -->
  <path d="M 600 620 L 600 600" stroke="#81c784" stroke-width="2" fill="none" marker-end="url(#arrowheadGreen)"/>

  <!-- Arrow Layer 2 → Layer 3 (up) -->
  <path d="M 600 420 L 600 400" stroke="#64b5f6" stroke-width="2" fill="none" marker-end="url(#arrowheadLight)"/>

  <!-- Arrow Layer 3 → Layer 4 (up) -->
  <path d="M 600 230 L 600 210" stroke="#ce93d8" stroke-width="2" fill="none" marker-end="url(#arrowheadPurple)"/>

  <!-- Decorative line -->
  <line x1="50" y1="35" x2="1150" y2="35" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
</svg>